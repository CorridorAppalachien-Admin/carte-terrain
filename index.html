<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5d2b">
  <title>Cartes terrain – Corridor appalachien</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="lib/pdf-lib.min.js"></script>
  <script src="lib/proj4.js"></script>
  <script src="lib/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <section id="accueil">
    <header class="entete">
      <img src="icones/logo.png" alt="Corridor appalachien" class="logo">
      <h1>Cartes terrain</h1>
    </header>
    <main>
      <label class="bouton-principal">
        Ajouter une carte PDF
        <input type="file" id="fichier" accept="application/pdf,.pdf" multiple hidden>
      </label>
      <p id="message" class="message" hidden></p>
      <ul id="liste" class="liste"></ul>
      <p id="vide" class="vide">Aucune carte pour l’instant. Ajoutez un PDF géoréférencé exporté d’ArcGIS Pro.</p>
      <details class="reglages">
        <summary>Réglages</summary>
        <label>Déclinaison magnétique (°, ouest négatif)
          <input type="number" id="declinaison" step="0.5" inputmode="decimal">
        </label>
        <p class="aide">Corrige la boussole du téléphone vers le nord vrai. Sud du Québec : environ −14 à −15°.</p>
      </details>
    </main>
    <footer class="pied">Les cartes restent dans ce téléphone. Rien n’est envoyé.</footer>
  </section>

  <section id="vue-carte" hidden>
    <div id="carte"></div>
    <div class="barre-haut">
      <button id="retour" class="rond" aria-label="Retour à la liste">‹</button>
      <span id="titre-carte"></span>
      <img src="icones/logo.png" class="logo-mini" alt="Corridor appalachien">
    </div>
    <div id="etat" class="etat"></div>
    <button id="recentrer" class="rond recentrer" aria-label="Me recentrer">◎</button>
    <div id="chargement" class="chargement" hidden>Préparation de la carte…</div>
  </section>
</body>
</html>
